name: PyYAML Windows wheel (CPython 3.15)

on:
  workflow_dispatch:
    inputs:
      pyyaml_ref:
        description: Tag/branch ref for PyYAML
        type: string
        default: 6.0.3
      libyaml_repo:
        description: Repo URL for libyaml
        type: string
        default: https://github.com/yaml/libyaml
      libyaml_ref:
        description: Tag/branch ref for libyaml
        type: string
        default: 0.2.5
      run_tests:
        description: Run the PyYAML test suite against the built wheel?
        type: boolean
        default: true

env:
  LIBYAML_REPO: ${{ inputs.libyaml_repo }}
  LIBYAML_REF: ${{ inputs.libyaml_ref }}
  WHEEL_SPEC: cp315-win_amd64  # use cp315t-win_amd64 for the free-threaded build

jobs:
  windows_wheel:
    name: pyyaml cp315-win_amd64 wheel
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    # autocrlf screws up tests under Windows
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf

    - name: Checkout PyYAML
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.pyyaml_ref }}

    - name: Install a python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x

    - name: Build sdist
      shell: bash
      env:
        PYYAML_FORCE_CYTHON: 1
        PYYAML_FORCE_LIBYAML: 0
      run: |
        set -eux
        python -V
        python -m pip install build
        python -m build -s .
        ls -l dist

    - name: Build libyaml
      shell: bash
      run: |
        set -eux
        git clone -b "$LIBYAML_REF" "$LIBYAML_REPO" libyaml 2>&1
        mkdir libyaml/build
        cd libyaml/build
        # no -G: CMake picks the newest Visual Studio installed on the runner
        cmake -A x64 -DYAML_STATIC_LIB_NAME=yaml -DCMAKE_POLICY_VERSION_MINIMUM=3.10 ..
        cmake --build . --config Release

    - name: Build/Test/Package wheel
      shell: bash
      env:
        CIBW_BUILD: ${{ env.WHEEL_SPEC }}
        CIBW_BUILD_VERBOSITY: 1
        CIBW_TEST_COMMAND: ${{ inputs.run_tests && 'pytest {package}' || '' }}
        CIBW_TEST_REQUIRES: pytest
      run: |
        set -eux
        python -m pip install -U cibuildwheel

        mkdir pyyaml
        tar zxf dist/*.tar.gz --strip-components=1 -C pyyaml

        cat << 'EOF' > build_config.toml
        [tool.cibuildwheel.config-settings]
        pyyaml_build_config='{"force":1, "include_dirs": ["../libyaml/include"], "library_dirs": ["../libyaml/build/Release"], "define": [["YAML_DECLARE_STATIC", 1]]}'
        EOF

        python -m cibuildwheel --config-file $(pwd)/build_config.toml --platform windows --output-dir ./wheelhouse ./pyyaml
        ls -l wheelhouse

    - name: Upload wheel
      uses: actions/upload-artifact@v7
      with:
        name: pyyaml-${{ env.WHEEL_SPEC }}
        path: wheelhouse/*.whl
        if-no-files-found: error
